# Regenerate the header with: cbindgen --crate frizbee-c --output include/frizbee/frizbee.h
language = "C"
cpp_compat = true
include_guard = "FRIZBEE_H"
usize_is_size_t = true
style = "both"
header = """/* frizbee C API. Generated by cbindgen, do not edit.
 *
 * Strings cross as frizbee_str_t (pointer + length) and are NOT validated as
 * UTF-8. Buffers returned by frizbee must be released with the matching
 * frizbee_*_free function, never with free(). A matcher is not thread-safe.
 *
 * Rust panics cannot unwind through this C ABI and abort the process. Panics
 * may result from resource exhaustion or inputs whose haystack counts or byte
 * offsets exceed the uint32_t fields used by the API.
 */"""

# The enums cross the ABI as plain int32_t (see frizbee_config_t), so they are
# no longer referenced by any exported item and must be included explicitly
[export]
include = [
    "frizbee_case_matching_t",
    "frizbee_unicode_matching_t",
    "frizbee_matching_t",
    "frizbee_sort_strategy_t",
]
