# Regenerate the header with: cbindgen --crate frizbee-c --output include/frizbee.h
language = "C"
cpp_compat = true
include_guard = "FRIZBEE_H"
usize_is_size_t = true
style = "both"
header = """/* frizbee C API. Generated by cbindgen from bindings/frizbee-c; do not edit.
 *
 * Strings cross as frizbee_str_t (pointer + length) and are NOT validated as
 * UTF-8; passing invalid UTF-8 is undefined behavior. Buffers returned by
 * frizbee must be released with the matching frizbee_*_free function, never
 * with free(). A matcher is not thread-safe: use one per thread or lock.
 *
 * There are no error codes: the API cannot fail on valid input. Two
 * pathological inputs panic and abort the process: more than UINT32_MAX
 * haystacks, which would overflow the match index, and a single haystack of
 * 4 GiB or more matched through frizbee_match_list_indices, whose byte
 * offsets would overflow the uint32_t indices. */"""

# The enums cross the ABI as plain int32_t (see frizbee_config_t), so they are
# no longer referenced by any exported item and must be included explicitly
[export]
include = [
    "frizbee_case_matching_t",
    "frizbee_unicode_matching_t",
    "frizbee_matching_t",
    "frizbee_sort_strategy_t",
]
